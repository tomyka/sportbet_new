# Caddy: TLS and routing for every environment on the host.
name: sportbet-edge
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      # The directory, not the file: a replaced file keeps its old inode in the container.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

networks:
  edge:
    external: true

volumes:
  caddy_data: {}
  caddy_config: {}
