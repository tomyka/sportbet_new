# Caddy: TLS and routing for every environment on the host.
name: sportbet-edge
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # The directory, not the file: a replaced file keeps its old inode in the container.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  edge:
    external: true

volumes:
  caddy_data: {}
  caddy_config: {}
