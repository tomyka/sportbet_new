# Weekly dependency updates (Mondays), grouped so a week is a few pull requests
# instead of dozens. Minor and patch bumps are grouped; a major is never
# grouped, so it arrives alone and is merged by hand. What may merge itself
# is decided by .github/workflows/dependabot-automerge.yml (patches and
# security fixes only, and only after the required checks are green).
version: 2
updates:
  # One pnpm workspace with one lockfile at the root; each package.json is
  # listed so Dependabot reads its dependencies too.
  - package-ecosystem: npm
    directories:
      - /
      - /apps/web
      - /packages/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # Next's majors are upgraded deliberately (decision 5's stack), never by a bot.
      - dependency-name: next
        update-types: ['version-update:semver-major']
      # vitest 4.1.12 is the version Stryker's vitest runner works with (CLAUDE.md,
      # quality gates), pinned exactly in the root, domain, db and web manifests
      # together with @vitest/coverage-v8: any bump, patch included, moves all of
      # them by hand once Stryker allows it. Dependabot bumped only some of the
      # manifests (#74), which cannot resolve to one lockfile.
      - dependency-name: vitest
      - dependency-name: '@vitest/coverage-v8'
      # The other @vitest/* packages version on their own; majors by hand.
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      # TypeScript 7 is a new compiler: typescript-eslint, knip and the strict gate
      # must support it first, by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node follows the Node major the images run (24, .nvmrc), by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      github-actions:
        update-types: [minor, patch]

  # The Dockerfile's node tag is pinned exactly to .nvmrc and bumped together
  # with it by hand.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      - dependency-name: node

  # postgres:18.x is pinned in app.yml, packages/db/src/migrations.ts and
  # backup.sh together, so a bot changing one file would desync them: by hand.
  # Caddy and Mailpit majors are by hand too.
  - package-ecosystem: docker-compose
    directories:
      - /infra/compose
      - /infra/edge
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      - dependency-name: postgres
      - dependency-name: caddy
        update-types: ['version-update:semver-major']
      - dependency-name: axllent/mailpit
        update-types: ['version-update:semver-major']
