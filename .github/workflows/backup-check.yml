name: Check the backup

# Staging answers over HTTPS: `reachable` calls the staging URL (the repository
# variable STAGING_URL) every morning and goes red, which GitHub emails the owner
# about, if it does not. The production backup is watched on the host itself
# (infra/host/backup-watch.sh).
on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachable:
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Staging answers over HTTPS
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then echo "::error::The repository variable STAGING_URL is not set."; exit 1; fi
          curl -fsS --max-time 20 "$STAGING_URL/api/health"
