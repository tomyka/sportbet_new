name: CI/CD

# Every push: check, image, E2E. A push to main also deploys to staging and
# smoke-tests it. A manual run redeploys an earlier commit's images (rollback).
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Full commit SHA whose images to redeploy to staging (skips checks and build)
        required: true

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/tomyka/sportbet_new

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: [self-hosted, sportbet-new]
    timeout-minutes: 30
    concurrency:
      # One runner: a superseded push's check would only queue behind a newer
      # one anyway, so cancel it instead of burning runner time on stale code.
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:component
      - run: pnpm test:db
      - run: pnpm test:feature

  image:
    if: github.event_name == 'push'
    runs-on: [self-hosted, sportbet-new]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      # One runner: a superseded push's image build would only queue behind a
      # newer one anyway, so cancel it instead of burning runner time on stale code.
      group: ci-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --target web -t "$IMAGE_PREFIX/web:$GITHUB_SHA" .
      - run: docker build --target migrate -t "$IMAGE_PREFIX/migrate:$GITHUB_SHA" .
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX/web:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX/migrate:$GITHUB_SHA"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  e2e:
    needs: image
    runs-on: [self-hosted, sportbet-new]
    timeout-minutes: 20
    env:
      WEB_IMAGE: ghcr.io/tomyka/sportbet_new/web:${{ github.sha }}
      MIGRATE_IMAGE: ghcr.io/tomyka/sportbet_new/migrate:${{ github.sha }}
      PROJECT: sportbet-e2e-${{ github.run_id }}
    concurrency:
      # One runner: a superseded push's E2E run would only queue behind a
      # newer one anyway, so cancel it instead of burning runner time on stale code.
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportbet/web exec playwright install chromium
      - name: Start the stack from this commit's images
        # Two steps, so a failing `up` fails this step (a command substitution
        # inside echo's argument would hide it).
        run: |
          url="$(infra/ci/e2e-stack.sh up "$PROJECT")"
          echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - name: Stop the stack
        if: always()
        run: infra/ci/e2e-stack.sh down "$PROJECT"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: apps/web/playwright-report

  staging:
    needs: [check, e2e]
    # A manual run only ever redeploys to main's staging; everything else
    # follows a green push to main. A dispatch's checkout below (ref:
    # inputs.tag) reruns that release's own deploy-staging.sh, and its
    # migrate+seed, unchanged - a rollback replays an old release's code
    # against today's schema, which is never rolled back with it.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.check.result == 'success' && needs.e2e.result == 'success')
      )
    runs-on: [self-hosted, sportbet-new]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: staging
      url: https://new.staging.sportbet.lt
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Deploy
        env:
          TAG: ${{ inputs.tag || github.sha }}
        run: infra/ci/deploy-staging.sh "$TAG"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  smoke:
    needs: staging
    # implicit success() would see staging's skipped result (e.g. a dispatch
    # for a non-main ref) and skip smoke silently instead of reporting it.
    if: ${{ !cancelled() && needs.staging.result == 'success' }}
    runs-on: [self-hosted, sportbet-new]
    timeout-minutes: 15
    concurrency:
      group: staging-smoke
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportbet/web exec playwright install chromium
      - run: pnpm test:smoke
        env:
          SMOKE_BASE_URL: https://new.staging.sportbet.lt
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: https://new.staging.sportbet.lt
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: staging-e2e-report
          path: apps/web/playwright-report
