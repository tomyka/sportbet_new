name: CI/CD

# Every push: check, image, E2E. A push to main also deploys to staging and
# smoke-tests it. A manual run redeploys an earlier commit to staging
# (rollback).
#
# Runners: GitHub-hosted. Staging is on Vercel + Neon (decision 12); smoke tests
# whatever `url` staging outputs.
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Full commit SHA to redeploy to staging (skips checks and build)
        required: true

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/tomyka/sportbet_new

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # A superseded push's check only tests stale code, so cancel it.
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Authenticated pulls: Docker Hub's anonymous limit is shared by
      # GitHub's hosted runners (429s on busy days). The token is read-only;
      # hosted runners are thrown away after the job, so no logout.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: The kit's own tests
        run: node --test "quality/*.test.mjs"
      # The one run of the quality gate per push (format, lint, typecheck,
      # markers, tests with coverage, CRAP, dead code, architecture): quality.yml
      # no longer repeats it on a push, only on a pull request. The strict
      # type-aware lint rules outgrew Node's default heap on the runner (exit
      # 134, out of memory); the hosted runner has the memory.
      - name: Quality gate
        run: node quality/gate.mjs check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: quality-reports
          path: |
            coverage/
            reports/
          if-no-files-found: ignore

  # The black-box tests run against the built Next app, beside the gate (they
  # are outside its coverage, quality.config.json testsOutsideGate).
  feature:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-feature-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:feature

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      # A superseded push's image build only builds stale code, so cancel it.
      group: ci-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Authenticated pulls: Docker Hub's anonymous limit is shared by
      # GitHub's hosted runners (429s on busy days). The token is read-only;
      # hosted runners are thrown away after the job, so no logout.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: docker build --target web --build-arg APP_COMMIT="$GITHUB_SHA" -t "$IMAGE_PREFIX/web:$GITHUB_SHA" .
      - run: docker build --target migrate -t "$IMAGE_PREFIX/migrate:$GITHUB_SHA" .
      # e2e runs on another hosted runner, which does not share this one's
      # Docker images, and only main's reach GHCR: hand them over as an artifact.
      - name: Save the images for e2e
        run: docker save "$IMAGE_PREFIX/web:$GITHUB_SHA" "$IMAGE_PREFIX/migrate:$GITHUB_SHA" | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX/web:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX/migrate:$GITHUB_SHA"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  image-arm64:
    # Production's images (decision 14): the host sportbet-ci is arm64, and
    # `image` above builds x86 for E2E. Built natively on GitHub's arm64 runner
    # (free for a public repository) once the commit is green, and pushed under
    # two tags: `<sha>-arm64`, which the host pins, and `main-arm64`, which
    # always names the latest green main commit. The x86 `<sha>` tags are left
    # as they are.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, feature, e2e]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Build provenance: signing needs the OIDC token, storing the attestation
      # needs attestations: write. This job only.
      id-token: write
      attestations: write
    concurrency:
      group: ci-image-arm64-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - run: |
          for target in web migrate; do
            docker build --target "$target" \
              --build-arg APP_COMMIT="$GITHUB_SHA" \
              -t "$IMAGE_PREFIX/$target:$GITHUB_SHA-arm64" \
              -t "$IMAGE_PREFIX/$target:main-arm64" .
          done
      # Scan before anything is pushed: a fixable CRITICAL vulnerability stops
      # the release. --ignore-unfixed keeps a base-image CVE with no fix from
      # blocking deploys; a known false positive is allowed only by an entry
      # (with a reason comment) in .trivyignore. HIGH findings are listed in
      # the job summary and never fail the job.
      - name: Trivy report, HIGH (web; does not fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}-arm64
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-high-web.txt
          trivyignores: .trivyignore
      - name: Trivy gate, CRITICAL (web; fails the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}-arm64
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore
      - name: Trivy report, HIGH (migrate; does not fail)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/migrate:${{ github.sha }}-arm64
          scanners: vuln
          severity: HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table
          output: trivy-high-migrate.txt
          trivyignores: .trivyignore
      - name: Trivy gate, CRITICAL (migrate; fails the job)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/migrate:${{ github.sha }}-arm64
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          trivyignores: .trivyignore
      - name: List HIGH findings in the job summary and the log
        if: always()
        run: |
          {
            echo "## Trivy: fixable HIGH vulnerabilities (CRITICAL ones fail the job)"
            for target in web migrate; do
              echo "### $target"
              echo '```'
              cat "trivy-high-$target.txt" 2>/dev/null || echo "(no report)"
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for target in web migrate; do
            docker push "$IMAGE_PREFIX/$target:$GITHUB_SHA-arm64"
            docker push "$IMAGE_PREFIX/$target:main-arm64"
          done
      # The digest the registry gave what was just pushed (docker push records
      # it in RepoDigests); the attestations below are about exactly these bytes.
      - name: Read the pushed digests
        id: digest
        run: |
          for target in web migrate; do
            digest="$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE_PREFIX/$target:$GITHUB_SHA-arm64" | grep "^$IMAGE_PREFIX/$target@sha256:" | head -n 1 | cut -d@ -f2)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $target after the push"; exit 1; }
            echo "$target=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Attest build provenance (web)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/web
          subject-digest: ${{ steps.digest.outputs.web }}
          push-to-registry: true
      - name: Attest build provenance (migrate)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}/migrate
          subject-digest: ${{ steps.digest.outputs.migrate }}
          push-to-registry: true
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  e2e:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_IMAGE: ghcr.io/tomyka/sportbet_new/web:${{ github.sha }}
      MIGRATE_IMAGE: ghcr.io/tomyka/sportbet_new/migrate:${{ github.sha }}
      PROJECT: sportbet-e2e-${{ github.run_id }}
    concurrency:
      # A superseded push's E2E run only tests stale code, so cancel it.
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Authenticated pulls: Docker Hub's anonymous limit is shared by
      # GitHub's hosted runners (429s on busy days). The token is read-only;
      # hosted runners are thrown away after the job, so no logout.
      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: images
      - name: Load this commit's images
        run: gunzip -c images.tar.gz | docker load && rm images.tar.gz
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportbet/web exec playwright install --with-deps chromium
      - name: Start the stack from this commit's images
        # Separate assignments, so a failing `up` fails this step (a command
        # substitution inside echo's argument would hide it).
        run: |
          url="$(infra/ci/e2e-stack.sh up "$PROJECT")"
          mailpit="$(infra/ci/e2e-stack.sh mailpit "$PROJECT")"
          echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "E2E_MAILPIT_URL=$mailpit" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - name: Stop the stack
        if: always()
        run: infra/ci/e2e-stack.sh down "$PROJECT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: e2e-report
          path: apps/web/playwright-report

  staging:
    needs: [check, feature, e2e]
    # A manual run only ever redeploys to main's staging; everything else
    # follows a green push to main. A dispatch checks out inputs.tag and
    # rebuilds and redeploys that commit exactly as a push would, migrate and
    # seed included - a rollback replays an old release's code against
    # today's schema, which is never rolled back with it.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.check.result == 'success' && needs.feature.result == 'success' && needs.e2e.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Pinned, so a CLI release cannot change a deploy between two commits.
      - run: npm install --global vercel@61.0.0
      # The pending sign-in cookie's key (apps/web/src/env.ts): made on the
      # runner the first time, piped into the Vercel project, never printed
      # (the owner agreed, #16). Then every sign-in setting must be there, or
      # the new deployment would refuse to start - checked before the
      # database is touched. `listed` is only grepped for names, never echoed.
      # The reminder route's bearer secret comes from the repository secret
      # STAGING_CRON_SECRET (the schedule in reminders.yml sends the same one),
      # and the links in mail need staging's own address (#33, R-97).
      - name: Staging's settings
        env:
          STAGING_CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        run: |
          if [ -z "$STAGING_CRON_SECRET" ]; then
            echo "::error::The STAGING_CRON_SECRET secret is not set. Owner step: run 'openssl rand -base64 48' and save the line as the GitHub repository secret STAGING_CRON_SECRET (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "${#STAGING_CRON_SECRET}" -lt 32 ]; then
            echo "::error::The STAGING_CRON_SECRET secret is shorter than 32 characters, which the app refuses. Owner step: run 'openssl rand -base64 48' and save the line as the GitHub repository secret STAGING_CRON_SECRET (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          # Assigned on its own line, so a failure of the script stops the step
          # (the status of $(...) inside an argument is lost).
          domain="$(bash .github/scripts/staging-domain.sh)"
          if ! [[ "$domain" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::staging-domain.sh did not print an https origin without a path."
            exit 1
          fi
          listed="$(vercel env ls production --token="$VERCEL_TOKEN")"
          if ! grep -qw AUTH_SECRET <<< "$listed"; then
            openssl rand -base64 48 | tr -d '\n' \
              | vercel env add AUTH_SECRET production --sensitive --token="$VERCEL_TOKEN" >/dev/null
            echo "::notice::Created staging's AUTH_SECRET"
          fi
          # Replaced on every deploy, so rotating the repository secret (or a
          # moved domain) reaches Vercel; a name that is not there yet is fine.
          vercel env rm CRON_SECRET production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$STAGING_CRON_SECRET" \
            | vercel env add CRON_SECRET production --sensitive --token="$VERCEL_TOKEN" >/dev/null
          vercel env rm APP_URL production --yes --token="$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$domain" \
            | vercel env add APP_URL production --token="$VERCEL_TOKEN" >/dev/null
          echo "::notice::Set staging's CRON_SECRET and APP_URL"
          listed="$(vercel env ls production --token="$VERCEL_TOKEN")"
          for name in SPORTBET_ENV AUTH_SECRET CRON_SECRET APP_URL MAIL_TRANSPORT MAIL_FROM_ADDRESS RESEND_API_KEY MAIL_ALLOWED_RECIPIENTS; do
            if ! grep -qw "$name" <<< "$listed"; then
              echo "::error::Vercel's production environment has no $name (the 4b plan, Task 19)."
              exit 1
            fi
          done
      - run: pnpm --filter @sportbet/db build
      # The direct (unpooled) connection, as Neon advises for migrations: its
      # pooler runs in transaction mode, which session-level work can trip on.
      # The app itself uses the pooled DATABASE_URL set on the Vercel project.
      - name: Migrate and seed the Neon staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_UNPOOLED }}
          # Where the seed runs: it refuses to run unless told (seed/staging.ts).
          SPORTBET_ENV: staging
          # The owner's address, for the one staging account (spec 4b).
          STAGING_ACCOUNT_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
        run: |
          if [ -z "$STAGING_ACCOUNT_EMAIL" ]; then
            echo "::error::The STAGING_OWNER_EMAIL secret is not set: staging would have no account to sign in with."
            exit 1
          fi
          node packages/db/dist/migrate.mjs
          node packages/db/dist/seed-staging.mjs
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        env:
          # Makes next.config.ts send X-Robots-Tag: noindex, nofollow.
          SPORTBET_ENV: staging
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        # The deployment's own URL sits behind Vercel's deployment protection;
        # the project's production domain (*.vercel.app, not a redirect) is
        # public and stable, so that is staging and what smoke tests.
        run: |
          deployment="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "::notice::Deployed $deployment"
          url="$(bash .github/scripts/staging-domain.sh)"
          if ! [[ "$url" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "::error::staging-domain.sh did not print an https origin without a path."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  smoke:
    needs: staging
    # implicit success() would see staging's skipped result (e.g. a dispatch
    # for a non-main ref) and skip smoke silently instead of reporting it.
    if: ${{ !cancelled() && needs.staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: staging-smoke
      cancel-in-progress: false
    env:
      SMOKE_BASE_URL: ${{ needs.staging.outputs.url }}
      E2E_BASE_URL: ${{ needs.staging.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportbet/web exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: staging-e2e-report
          path: apps/web/playwright-report
