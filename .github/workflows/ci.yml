name: CI/CD

# Every push: check, image, E2E. A push to main also deploys to staging and
# smoke-tests it. A manual run redeploys an earlier commit to staging
# (rollback).
#
# Runners: GitHub-hosted until the self-hosted runner on sportbet-new exists
# (decision 12). Staging is on Vercel + Neon meanwhile; the Oracle deploy is
# kept below as `staging-oracle`, switched off. Moving staging back to Oracle
# is a change to the deploy jobs only: turn `staging-oracle` on and `staging`
# off (or swap their names); smoke tests whatever `url` staging outputs.
on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Full commit SHA to redeploy to staging (skips checks and build)
        required: true

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/tomyka/sportbet_new

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The build of sportbet's image for the parity tests adds a few minutes.
    timeout-minutes: 45
    concurrency:
      # A superseded push's check only tests stale code, so cancel it.
      group: ci-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm test:component
      - run: pnpm test:db
      # The parity tests run sportbet's own app (tools/migrate/README.md,
      # "Parity"): its image at the commit the synthetic dump's golden rows
      # were made at. No registry holds it, so it is built here from
      # sportbet's private repository with a read-only token, and never
      # pushed. Keep the SHA in step with SPORTBET_TEST_TAG
      # (tools/migrate/test/support/reader-containers.ts).
      - name: Check out sportbet at the parity tests' commit
        uses: actions/checkout@v7
        with:
          repository: tomyka/sportbet
          ref: 1ac955f5919323ef5b8e0369274da20ddfb9ea75
          token: ${{ secrets.SPORTBET_READ_TOKEN }}
          path: .sportbet
          persist-credentials: false
      - name: Build sportbet's app image
        run: |
          docker build -q -f .sportbet/docker/staging/Dockerfile --target app \
            -t sportbet-app:1ac955f .sportbet
          rm -rf .sportbet
      # The production-copy reader, on a synthetic dump only: CI has no OCI
      # credentials and never reaches Oracle.
      - run: pnpm test:migrate
      - run: pnpm test:feature

  image:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      # A superseded push's image build only builds stale code, so cancel it.
      group: ci-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --target web -t "$IMAGE_PREFIX/web:$GITHUB_SHA" .
      - run: docker build --target migrate -t "$IMAGE_PREFIX/migrate:$GITHUB_SHA" .
      # e2e runs on another hosted runner, which does not share this one's
      # Docker images, and only main's reach GHCR: hand them over as an artifact.
      - name: Save the images for e2e
        run: docker save "$IMAGE_PREFIX/web:$GITHUB_SHA" "$IMAGE_PREFIX/migrate:$GITHUB_SHA" | gzip -1 > images.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: images.tar.gz
          retention-days: 1
          compression-level: 0
      - name: Push (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_PREFIX/web:$GITHUB_SHA"
          docker push "$IMAGE_PREFIX/migrate:$GITHUB_SHA"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  e2e:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEB_IMAGE: ghcr.io/tomyka/sportbet_new/web:${{ github.sha }}
      MIGRATE_IMAGE: ghcr.io/tomyka/sportbet_new/migrate:${{ github.sha }}
      PROJECT: sportbet-e2e-${{ github.run_id }}
    concurrency:
      # A superseded push's E2E run only tests stale code, so cancel it.
      group: ci-e2e-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: images
      - name: Load this commit's images
        run: gunzip -c images.tar.gz | docker load && rm images.tar.gz
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportbet/web exec playwright install --with-deps chromium
      - name: Start the stack from this commit's images
        # Separate assignments, so a failing `up` fails this step (a command
        # substitution inside echo's argument would hide it).
        run: |
          url="$(infra/ci/e2e-stack.sh up "$PROJECT")"
          mailpit="$(infra/ci/e2e-stack.sh mailpit "$PROJECT")"
          echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "E2E_MAILPIT_URL=$mailpit" >> "$GITHUB_ENV"
      - run: pnpm test:e2e
      - name: Stop the stack
        if: always()
        run: infra/ci/e2e-stack.sh down "$PROJECT"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: apps/web/playwright-report

  staging:
    needs: [check, e2e]
    # A manual run only ever redeploys to main's staging; everything else
    # follows a green push to main. A dispatch checks out inputs.tag and
    # rebuilds and redeploys that commit exactly as a push would, migrate and
    # seed included - a rollback replays an old release's code against
    # today's schema, which is never rolled back with it.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' ||
        (needs.check.result == 'success' && needs.e2e.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Pinned, so a CLI release cannot change a deploy between two commits.
      - run: npm install --global vercel@61.0.0
      # The pending sign-in cookie's key (apps/web/src/env.ts): made on the
      # runner the first time, piped into the Vercel project, never printed
      # (the owner agreed, #16). Then every sign-in setting must be there, or
      # the new deployment would refuse to start - checked before the
      # database is touched. `listed` is only grepped for names, never echoed.
      - name: Staging's sign-in settings
        run: |
          listed="$(vercel env ls production --token="$VERCEL_TOKEN")"
          if ! grep -qw AUTH_SECRET <<< "$listed"; then
            openssl rand -base64 48 | tr -d '\n' \
              | vercel env add AUTH_SECRET production --sensitive --token="$VERCEL_TOKEN" >/dev/null
            echo "::notice::Created staging's AUTH_SECRET"
            listed="$(vercel env ls production --token="$VERCEL_TOKEN")"
          fi
          for name in SPORTBET_ENV AUTH_SECRET MAIL_TRANSPORT MAIL_FROM_ADDRESS RESEND_API_KEY MAIL_ALLOWED_RECIPIENTS; do
            if ! grep -qw "$name" <<< "$listed"; then
              echo "::error::Vercel's production environment has no $name (the 4b plan, Task 19)."
              exit 1
            fi
          done
      - run: pnpm --filter @sportbet/db build
      # The direct (unpooled) connection, as Neon advises for migrations: its
      # pooler runs in transaction mode, which session-level work can trip on.
      # The app itself uses the pooled DATABASE_URL set on the Vercel project.
      - name: Migrate and seed the Neon staging database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL_UNPOOLED }}
          # The owner's address, for the one staging account (spec 4b).
          STAGING_ACCOUNT_EMAIL: ${{ secrets.STAGING_OWNER_EMAIL }}
        run: |
          if [ -z "$STAGING_ACCOUNT_EMAIL" ]; then
            echo "::error::The STAGING_OWNER_EMAIL secret is not set: staging would have no account to sign in with."
            exit 1
          fi
          node packages/db/dist/migrate.mjs
          node packages/db/dist/seed-staging.mjs
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        env:
          # Makes next.config.ts send X-Robots-Tag: noindex, nofollow.
          SPORTBET_ENV: staging
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        id: deploy
        # The deployment's own URL sits behind Vercel's deployment protection;
        # the project's production domain (*.vercel.app, not a redirect) is
        # public and stable, so that is staging and what smoke tests.
        run: |
          deployment="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "::notice::Deployed $deployment"
          domains="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?production=true&redirects=false&teamId=$VERCEL_ORG_ID")"
          domain="$(jq -r '[.domains[] | select(.verified and (.name | endswith(".vercel.app")))][0].name // empty' <<< "$domains")"
          if [ -z "$domain" ]; then
            echo "::error::The project has no verified *.vercel.app production domain."
            exit 1
          fi
          echo "url=https://$domain" >> "$GITHUB_OUTPUT"

  staging-oracle:
    # Off while staging is on Vercel (decision 12): the Oracle deploy to
    # sportbet-new, kept intact for the move back. A dispatch's checkout
    # (ref: inputs.tag) reruns that release's own deploy-staging.sh, and its
    # migrate+seed, unchanged.
    if: false
    needs: [check, e2e]
    runs-on: [self-hosted, sportbet-new]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    outputs:
      url: https://new.staging.sportbet.lt
    environment:
      name: staging
      url: https://new.staging.sportbet.lt
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Deploy
        env:
          TAG: ${{ inputs.tag || github.sha }}
        run: infra/ci/deploy-staging.sh "$TAG"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  smoke:
    needs: staging
    # implicit success() would see staging's skipped result (e.g. a dispatch
    # for a non-main ref) and skip smoke silently instead of reporting it.
    if: ${{ !cancelled() && needs.staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: staging-smoke
      cancel-in-progress: false
    env:
      SMOKE_BASE_URL: ${{ needs.staging.outputs.url }}
      E2E_BASE_URL: ${{ needs.staging.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sportbet/web exec playwright install --with-deps chromium
      - run: pnpm test:smoke
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: staging-e2e-report
          path: apps/web/playwright-report
