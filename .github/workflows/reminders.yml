# Staging's reminder schedule (R-97, decision 12): every 15 minutes calls the
# reminder route of the Vercel-hosted staging. Production's equivalent is the
# systemd timer in infra/host, installed at the switch-over. GitHub may start a
# run late or skip one under load; the next run picks everything up.
name: reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    # Not in forks, which have no staging.
    if: github.repository == 'tomyka/sportbet_new'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      # An unset secret is a green skipped run, not a failure email every 15
      # minutes; a set but wrong one still fails below (401).
      - name: Check the secret is set
        id: secret
        env:
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::The STAGING_CRON_SECRET secret is not set, so no reminders are sent. Owner step: run 'openssl rand -base64 48' and save the line as the GitHub repository secret STAGING_CRON_SECRET (Settings > Secrets and variables > Actions)."
            echo "set=false" >> "$GITHUB_OUTPUT"
          else
            echo "set=true" >> "$GITHUB_OUTPUT"
          fi
      # Only the script is needed.
      - if: steps.secret.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Call the reminder route
        if: steps.secret.outputs.set == 'true'
        env:
          CRON_SECRET: ${{ secrets.STAGING_CRON_SECRET }}
        run: |
          url="$(bash .github/scripts/staging-domain.sh)"
          # -f fails the step on any non-2xx; the body is counts only.
          curl -fsS --max-time 90 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$url/api/cron/reminders"
          echo
