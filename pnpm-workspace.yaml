packages:
  - apps/*
  - packages/*
  - tools/*

saveExact: true
engineStrict: true

onlyBuiltDependencies:
  - esbuild

# Optional native speed-ups pulled in by @testcontainers/postgresql (via
# ssh2, for its tunnelling feature); not needed for the test harness.
ignoredBuiltDependencies:
  - cpu-features
  - protobufjs
  - ssh2

# Dependabot advisories on dev-only tooling (test runner and mutation testing):
# the patched releases are within the same major, so pin the whole tree to them.
overrides:
  qs: 6.15.2
  source-map-js: 1.2.2
  # vite 8.3.3 fixes the advisories on the dev server (vitest runs vite); the
  # patched release is within the same major.
  vite: 8.3.3
  # drizzle-kit's legacy loader pulls esbuild 0.18.20 (advisory fixed in 0.25.0);
  # the current esbuild is already in the tree for vite.
  '@esbuild-kit/core-utils>esbuild': 0.28.2
